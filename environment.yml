# Merge with existing environment.yml rather than overwrite if it has diverged.
name: glint-bench
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - ffmpeg
  - pip:
      - yt-dlp>=2025.1,<2027
      - python-dotenv>=1.0,<2
      - PyYAML>=6.0,<7
      - openai>=1.50,<3
      - google-genai>=1.0,<2
      - pytest>=8,<10
      # Local inference; adjust torch wheel/build for host CUDA if necessary.
      - torch>=2.4,<2.9
      - transformers>=4.51,<5
      - accelerate>=1.0,<2
      - pillow>=10,<13
