# Shared model-call policy, owned by Adapter.
inference:
  retry:
    max_retries: 2
    initial_delay: 1.0
    max_delay: 30.0

# Example entries. Replace model IDs with verified video-and-image-capable VLMs.
# Both flags are mandatory declarations; integration tests must verify real capability.
providers:
  cloud_openai:
    backend: openai_compatible
    api_key_env: OPENAI_API_KEY
    # base_url_env: OPENAI_BASE_URL
    timeout: 120
    max_retries: 0  # Adapter runtime owns transport retry

  cloud_gemini:
    backend: gemini
    api_key_env: GEMINI_API_KEY
    timeout: 120
    max_retries: 0  # Adapter runtime owns transport retry

  local_hf:
    backend: huggingface
    device_map: auto
    dtype: bfloat16
    trust_remote_code: false

models:
  example_cloud_video:
    provider: cloud_gemini
    model_id: REPLACE_WITH_VERIFIED_VIDEO_MODEL
    supports_native_video: true
    supports_images: true

  example_local_video:
    provider: local_hf
    model_id: REPLACE_WITH_VERIFIED_LOCAL_VIDEO_MODEL
    generation:
      max_new_tokens: 512
    native_video_protocol: qwen3_vl
    # model_path_env: LOCAL_MODEL_PATH
    supports_native_video: true
    supports_images: true
  
  gemini-3.1-pro:
    provider: cloud_gemini
    model_id: gemini-3.1-pro-preview
    supports_native_video: true
    supports_images: true